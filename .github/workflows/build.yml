name: Build binaries

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  binaries:
    name: Cross-platform binary builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true

      - name: Build binaries
        run: |
          mkdir -p dist
          LDFLAGS="-s -w \
            -X github.com/prometheus/common/version.Version=${GITHUB_REF_NAME} \
            -X github.com/prometheus/common/version.Revision=${GITHUB_SHA} \
            -X github.com/prometheus/common/version.Branch=${GITHUB_REF_NAME} \
            -X github.com/prometheus/common/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for target in linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            echo "Building ${os}/${arch}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
              go build -ldflags "${LDFLAGS}" -o "dist/freeswitch_exporter-${os}-${arch}"
          done

      - name: Upload build artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  docker:
    name: Cross-platform Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          tags: type=semver,pattern={{version}}
          images: florentchauveau/freeswitch_exporter

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            BRANCH=${{ github.ref_name }}
